name: MCP server checks

on:
  push:
  pull_request:

jobs:
  mcp:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Check MCP process starts
        run: |
          node index.js </dev/null 2> startup.log
          grep -F '[matrix-mcp] Server started and waiting for requests.' startup.log
